[project]
name = "server"
version = "0.1.0"
description = "KnowledgeDock API server: project-scoped RAG with FastAPI, Celery and pgvector"
authors = [
    {name = "Abhishek Kuber"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.129.0,<0.130.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "supabase (>=2.28.0,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "clerk-backend-api (>=5.0.1,<6.0.0)",
    "boto3 (>=1.42.56,<2.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "redis (>=7.2.1,<8.0.0)",
    "unstructured[all-docs] (==0.18.11)",
    "scrapingbee (>=2.0.2,<3.0.0)",
    "langchain (==1.2.9)",
    "langchain-community (==0.4.1)",
    "langchain-huggingface (==1.2.0)",
    "sentence-transformers (>=5.2.3,<6.0.0)",
    "langchain-openai (>=1.1.10,<2.0.0)",
    "ddgs (>=9.9.1,<10.0.0)",
    "langchain-tavily (>=0.2.13,<0.3.0)",
    "openai (>=2.30.0,<3.0.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "cohere (>=6.1.0,<7.0.0)"
]


# Only needed for the offline evaluation in evaluation/. Install with: poetry install --with eval
[tool.poetry.group.eval]
optional = true

[tool.poetry.group.eval.dependencies]
ragas = ">=0.4.3,<0.5.0"
pyyaml = ">=6.0.3,<7.0.0"
scipy = ">=1.17.1,<2.0.0"
tiktoken = ">=0.12.0,<0.13.0"
numpy = ">=2.4.2,<3.0.0"
pillow = ">=12.1.1,<13.0.0"

# Notebooks only. Install with: poetry install --with dev
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ipykernel = ">=7.2.0,<8.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
