# Add keyword (full-text) search fused with vector search by RRF. Exact terms (names,
# symbols, figure/table words) may recover chunks that embeddings miss. App's default weights.
description: hybrid search (vector 0.7 / keyword 0.3), 20 candidates
split: dev
retrieval_only: true
guardrail: false
settings:
  rag_strategy: hybrid
  chunks_per_search: 20
